name: Harbor-maester website

on:
  push:
    branches: [main]
    paths:
      - 'project-website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: harbor-maester-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static site
        run: |
          python project-website/check_site.py
          node --check project-website/app.js
      - name: Package only public static files
        run: |
          mkdir -p site-dist/assets
          cp project-website/index.html project-website/style.css project-website/app.js project-website/favicon.svg site-dist/
          cp project-website/assets/*.png site-dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
