[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-decision-engine"
version = "0.1.0"
description = "Synthetic harbor watch decision support demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3", "numpy>=2.1,<3", "shapely>=2.0,<3", "aiosqlite>=0.20,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "rank-bm25>=0.2.2,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
groq = ["groq>=0.31,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harbor_engine = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
